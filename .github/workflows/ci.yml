name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # Nothing here actually touches the macOS Keychain — test/accounts.test.mjs
    # replaces `security` with a fake Node script (see AGENT_HUB_ACCOUNTS_TEST_SECURITY_BIN
    # in src/daemon/accounts/keychain.ts), so this runs fine on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build:runtime

      - run: npm run package
