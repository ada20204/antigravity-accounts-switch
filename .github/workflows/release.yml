name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.2.0, leave empty to read from package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and package VSIX
        run: |
          npm run vscode:prepublish
          npm run package

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag_name }}-vsix
          path: '*.vsix'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: "${{ env.VSCE_PAT != '' }}"
        run: |
          echo "Publishing to Visual Studio Code Marketplace..."
          npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Marketplace PAT Notice
        if: "${{ env.VSCE_PAT == '' }}"
        run: |
          echo "::notice title=Marketplace Skipped::VSCE_PAT secret is not configured in GitHub repository. Add VSCE_PAT in repository Settings -> Secrets and variables -> Actions to enable automated Marketplace publishing."
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
